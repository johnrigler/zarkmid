<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  background: #0d0f0d;
  color: #d8e2d8;
  font: 16px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
main {
  position: relative;
  width: 100%;
  max-width: 960px;
  height: var(--lantern-height, 100dvh);
  max-height: var(--lantern-height, 100dvh);
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header { flex: 0 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
body.playing header { display: none; }
h1 { font-size: 20px; margin: 0 auto 0 0; font-weight: 600; }
select, button, input {
  font: inherit;
  color: inherit;
  background: #171b17;
  border: 1px solid #3b463b;
  border-radius: 4px;
  padding: 9px 10px;
}
button { cursor: pointer; }
#send { touch-action: none; user-select: none; -webkit-user-select: none; }
#movePad {
  position: fixed;
  z-index: 1000;
  display: none;
  grid-template-columns: repeat(4, 48px);
  grid-template-rows: repeat(3, 48px);
  gap: 6px;
  padding: 8px;
  background: #0d0f0d;
  border: 1px solid #586658;
  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(0,0,0,.45);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#movePad.open { display: grid; }
#movePad button {
  width: 48px;
  height: 48px;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 20px;
  border-radius: 8px;
}
#movePad button[data-move].active {
  background: #334033;
  border-color: #9aae9a;
}
#movePad .vertical {
  font-size: 16px;
}
#movePad .cancel {
  color: #879687;
}
#movePad .blank {
  visibility: hidden;
}
#movePad .action {
  grid-column: span 2;
  width: auto;
  height: 42px;
  font-size: 12px;
}
button:disabled, input:disabled { opacity: .5; cursor: default; }
#status { display: none; }
#gameStatus {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
  margin: 0;
  padding: 6px 10px;
  background: #d8e2d8;
  color: #0d0f0d;
  border: 1px solid #d8e2d8;
  font-weight: 700;
  white-space: nowrap;
}
#gameLocation {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
#gameStats { flex: 0 0 auto; }
#screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #080a08;
  border: 1px solid #2d352d;
  padding: 14px;
  margin: 0 0 10px;
}
form {
  flex: 0 0 auto;
  display: flex;
  gap: 8px;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
#command { flex: 1; min-width: 0; }
.small { flex: 0 0 auto; font-size: 13px; color: #879687; margin: 10px 0 0; }
dialog {
  width: min(92vw, 560px);
  max-height: 80dvh;
  overflow: auto;
  border: 1px solid #586658;
  border-radius: 10px;
  background: #0d0f0d;
  color: #d8e2d8;
  padding: 0;
}
dialog::backdrop { background: rgba(0,0,0,.72); }
.dialogBody { display: grid; gap: 12px; padding: 16px; }
.dialogBody h2, .dialogBody p { margin: 0; }
.dialogActions { display: flex; gap: 8px; flex-wrap: wrap; }
.identityValue { color: #9aae9a; overflow-wrap: anywhere; font-size: 12px; }
.savedList { display: grid; gap: 8px; }
.savedList button { width: 100%; text-align: left; }

@media (max-width: 700px), (max-height: 700px) {
  main { padding: 10px; }
  header { margin-bottom: 6px; }
  h1 { font-size: 18px; }
  select, button, input { padding: 8px 9px; }
  #gameStatus { padding: 5px 8px; font-size: 13px; }
  #screen { padding: 10px; margin-bottom: 8px; }
  .small { display: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Lantern</h1>
    <select id="game" aria-label="Game">
      <option value="zork1">Zork I</option>
      <option value="zork2">Zork II</option>
      <option value="zork3">Zork III</option>
    </select>
    <button id="newGame" type="button">New game</button>
    <button id="loadGameStart" type="button">Load game</button>
    <button id="mySaves" type="button" hidden>My saves</button>
  </header>

  <div id="status" aria-live="polite"></div>
  <div id="gameStatus" aria-live="polite">
    <span id="gameLocation">—</span>
    <span id="gameStats">Score: — · Moves: 0</span>
  </div>
  <pre id="screen">Lantern browser client loading.</pre>

  <form id="commandForm">
    <input id="command" type="text" autocomplete="off" spellcheck="false"
           maxlength="200" placeholder="Your move…" disabled>
    <button id="send" type="button" aria-label="Controls" aria-expanded="false" disabled>☰</button>
  </form>

  <div id="movePad" aria-hidden="true">
    <button class="vertical" type="button" data-move="u" aria-label="Up">U</button>
    <button type="button" data-move="nw" aria-label="Northwest">↖</button>
    <button type="button" data-move="n" aria-label="North">↑</button>
    <button type="button" data-move="ne" aria-label="Northeast">↗</button>

    <button class="vertical" type="button" data-move="d" aria-label="Down">D</button>
    <button type="button" data-move="w" aria-label="West">←</button>
    <button class="cancel" type="button" data-cancel="true" aria-label="Cancel movement">●</button>
    <button type="button" data-move="e" aria-label="East">→</button>

    <span class="blank" aria-hidden="true"></span>
    <button type="button" data-move="sw" aria-label="Southwest">↙</button>
    <button type="button" data-move="s" aria-label="South">↓</button>
    <button type="button" data-move="se" aria-label="Southeast">↘</button>

    <button type="button" data-command="inventory" aria-label="Inventory">I</button>
    <button type="button" data-command="look" aria-label="Look">L</button>
    <span class="blank" aria-hidden="true"></span>
    <span class="blank" aria-hidden="true"></span>

    <button id="saveGame" class="action" type="button">Save game</button>
    <button id="loadGame" class="action" type="button">Load game</button>
    <button id="chooseGame" class="action" type="button">Games</button>
    <span class="blank" aria-hidden="true"></span>
    <input id="loadFile" type="file" accept="application/json,.json" hidden>
  </div>

  <p class="small">
    This is a thin client. Lantern stores the ordered move list and replays it through dfrotz with a fixed seed.
  </p>
</main>

<dialog id="saveDialog">
  <div class="dialogBody">
    <h2>Game saved</h2>
    <p>Your JSON save was downloaded normally.</p>
    <p id="saveIdentityText" class="small"></p>
    <code id="saveIdentityValue" class="identityValue"></code>
    <div class="dialogActions">
      <button id="saveIdentityAction" type="button"></button>
      <button id="saveDialogClose" type="button">Not now</button>
    </div>
  </div>
</dialog>

<dialog id="mySavesDialog">
  <div class="dialogBody">
    <h2>Your Lantern saves</h2>
    <p id="mySavesIdentity" class="identityValue"></p>
    <div id="mySavesList" class="savedList">Loading…</div>
    <div class="dialogActions">
      <button id="mySavesClose" type="button">Close</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  const game = document.getElementById("game");
  const newGame = document.getElementById("newGame");
  const loadGameStart = document.getElementById("loadGameStart");
  const form = document.getElementById("commandForm");
  const command = document.getElementById("command");
  const send = document.getElementById("send");
  const screen = document.getElementById("screen");
  const status = document.getElementById("status");
  const gameLocation = document.getElementById("gameLocation");
  const gameStats = document.getElementById("gameStats");
  const movePad = document.getElementById("movePad");
  const saveGame = document.getElementById("saveGame");
  const loadGame = document.getElementById("loadGame");
  const loadFile = document.getElementById("loadFile");
  const chooseGame = document.getElementById("chooseGame");
  const mySaves = document.getElementById("mySaves");
  const saveDialog = document.getElementById("saveDialog");
  const saveIdentityText = document.getElementById("saveIdentityText");
  const saveIdentityValue = document.getElementById("saveIdentityValue");
  const saveIdentityAction = document.getElementById("saveIdentityAction");
  const saveDialogClose = document.getElementById("saveDialogClose");
  const mySavesDialog = document.getElementById("mySavesDialog");
  const mySavesIdentity = document.getElementById("mySavesIdentity");
  const mySavesList = document.getElementById("mySavesList");
  const mySavesClose = document.getElementById("mySavesClose");

  const FILE_PROXY_URL = "https://rigler.org/fileproxy";
  const CHISEL_IDENTITY_URL = "https://johnrigler.github.io/chisel/identity.html";
  const IDENTITY_STORAGE_KEY = "lantern.chiselIdentity.v1";

  let sessionId = null;
  let movePadOpen = false;
  let chiselIdentity = "";
  let pendingSavedSession = null;

  function updateViewportHeight() {
    const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty("--lantern-height", height + "px");
  }

  updateViewportHeight();
  window.addEventListener("resize", () => {
    updateViewportHeight();
    scrollScreenToBottom();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => {
      updateViewportHeight();
      if (movePadOpen) positionMovePad();
      scrollScreenToBottom();
    });
  }

  const api = path => new URL(path.replace(/^\//, ""), window.location.href).toString();

  function identityDirectory() {
    return "lantern/" + chiselIdentity.replace(/[^a-zA-Z0-9_-]/g, "_");
  }

  function readIdentity() {
    const params = new URLSearchParams(window.location.search);
    const incoming = String(params.get("identity") || "").trim();
    if (/^chisel:v1:[0-9a-fA-F]{66}$/.test(incoming)) {
      chiselIdentity = incoming.toLowerCase();
      try { localStorage.setItem(IDENTITY_STORAGE_KEY, chiselIdentity); } catch (error) {}
      params.delete("identity");
      const clean = window.location.pathname + (params.toString() ? "?" + params.toString() : "") + window.location.hash;
      window.history.replaceState(null, "", clean);
    } else {
      try { chiselIdentity = localStorage.getItem(IDENTITY_STORAGE_KEY) || ""; } catch (error) {}
    }
    mySaves.hidden = !chiselIdentity;
  }

  async function fileProxyPost(path, body) {
    const response = await fetch(FILE_PROXY_URL + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.error) throw new Error(data.error || ("HTTP " + response.status));
    return data;
  }

  async function saveSessionToIdentity(session) {
    if (!chiselIdentity) throw new Error("No Chisel identity is loaded.");
    const random = Array.from(crypto.getRandomValues(new Uint8Array(4)))
      .map(value => value.toString(16).padStart(2, "0")).join("");
    const filename = (session.game || "lantern") + "-" + Date.now() + "-" + random + ".lantern.json";
    const path = identityDirectory() + "/" + filename;
    const payload = {
      format: "lantern-save-v1",
      identity: chiselIdentity,
      savedAt: new Date().toISOString(),
      session
    };
    const response = await fetch(FILE_PROXY_URL + "/save?filename=" + encodeURIComponent(path), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.error) throw new Error(data.error || ("HTTP " + response.status));
    return data;
  }

  async function loadSessionObject(saved, label) {
    const session = saved && saved.session ? saved.session : saved;
    const body = await request("api/session/import", {
      method: "POST",
      body: JSON.stringify({ session })
    });
    sessionId = body.session.id;
    game.value = body.session.game;
    document.body.classList.add("playing");
    showResult(body.result);
    status.textContent = "Loaded " + label + " · " + body.session.moves.length + " moves";
    return body;
  }

  function openSaveChoice(session) {
    pendingSavedSession = session;
    if (chiselIdentity) {
      saveIdentityText.textContent = "You can also keep a copy in FileProxy under your public Chisel identity.";
      saveIdentityValue.textContent = chiselIdentity;
      saveIdentityAction.textContent = "Save to my identity";
    } else {
      saveIdentityText.textContent = "Optional: create or recover a Chisel identity so Lantern saves can follow you without requiring any cryptocurrency.";
      saveIdentityValue.textContent = "";
      saveIdentityAction.textContent = "Create / use Chisel identity";
    }
    if (typeof saveDialog.showModal === "function") saveDialog.showModal();
  }

  async function refreshMySaves() {
    if (!chiselIdentity) return;
    mySavesIdentity.textContent = chiselIdentity;
    mySavesList.textContent = "Loading…";
    try {
      const listing = await fileProxyPost("/list", { dirname: identityDirectory() });
      const files = (listing.list || []).filter(item => item.type === "file" && /\.lantern\.json$/i.test(item.name));
      files.sort((a, b) => b.name.localeCompare(a.name));
      mySaves.textContent = files.length ? "My saves (" + files.length + ")" : "My saves";
      mySavesList.textContent = "";
      if (!files.length) {
        mySavesList.textContent = "No FileProxy saves yet.";
        return;
      }
      files.forEach(item => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.name;
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const saved = await fileProxyPost("/load", { filename: identityDirectory() + "/" + item.name });
            if (mySavesDialog.open) mySavesDialog.close();
            await loadSessionObject(saved, item.name);
          } catch (error) {
            status.textContent = "Load failed: " + error.message;
          } finally {
            button.disabled = false;
          }
        });
        mySavesList.appendChild(button);
      });
    } catch (error) {
      mySavesList.textContent = "Could not load FileProxy saves: " + error.message;
    }
  }

  function setBusy(busy) {
    game.disabled = busy;
    newGame.disabled = busy;
    loadGameStart.disabled = busy;
    command.disabled = busy || !sessionId;
    send.disabled = busy || !sessionId;
  }

  function scrollScreenToBottom() {
    requestAnimationFrame(() => {
      screen.scrollTop = screen.scrollHeight;
      requestAnimationFrame(() => {
        screen.scrollTop = screen.scrollHeight;
      });
    });
  }

  function showResult(result) {
    screen.textContent = result && result.stdout ? result.stdout : "(no dfrotz output)";
    if (result && result.status) {
      gameLocation.textContent = result.status.location || "Unknown";
      const score = Number.isInteger(result.status.score) ? result.status.score : "—";
      const moves = Number.isInteger(result.status.moves) ? result.status.moves : 0;
      gameStats.textContent = `Score: ${score} · Moves: ${moves}`;
    }
    scrollScreenToBottom();
  }

  async function request(path, options = {}) {
    const response = await fetch(api(path), {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body;
  }

  async function health() {
    try {
      const body = await request("health", { method: "GET", headers: {} });
      const missing = Object.entries(body.games || {})
        .filter(([, value]) => !value.present)
        .map(([name]) => name);
      status.textContent = missing.length
        ? `Lantern is up. Missing game files: ${missing.join(", ")}`
        : "Lantern is up. Start a game.";
    } catch (err) {
      status.textContent = `Lantern unavailable: ${err.message}`;
    }
  }

  async function startGame() {
    setBusy(true);
    status.textContent = `Starting ${game.options[game.selectedIndex].text}…`;
    try {
      const body = await request("api/session", {
        method: "POST",
        body: JSON.stringify({ game: game.value, seed: 1 })
      });
      sessionId = body.session.id;
      document.body.classList.add("playing");
      showResult(body.result);
      status.textContent = `Session ${sessionId} · 0 moves`;
    } catch (err) {
      sessionId = null;
      screen.textContent = `Error: ${err.message}`;
      status.textContent = "Could not start session.";
    } finally {
      setBusy(false);
      if (sessionId) {
        command.focus();
        scrollScreenToBottom();
      }
    }
  }

  async function submitMove(move) {
    move = String(move || "").trim();
    if (!move || !sessionId) return;

    command.value = "";
    setBusy(true);
    status.textContent = `Sending: ${move}`;

    try {
      const body = await request(`api/session/${sessionId}/move`, {
        method: "POST",
        body: JSON.stringify({ command: move })
      });
      showResult(body.result);
      status.textContent = `Session ${sessionId} · ${body.session.moves.length} moves`;
    } catch (err) {
      status.textContent = `Move failed: ${err.message}`;
    } finally {
      setBusy(false);
      command.focus();
      scrollScreenToBottom();
    }
  }

  function closeMovePad() {
    movePadOpen = false;
    movePad.classList.remove("open");
    movePad.setAttribute("aria-hidden", "true");
    send.setAttribute("aria-expanded", "false");
  }

  function positionMovePad() {
    if (!movePadOpen) return;

    const sendRect = send.getBoundingClientRect();
    const padRect = movePad.getBoundingClientRect();
    const viewportWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

    let left = sendRect.right - padRect.width;
    let top = sendRect.top - padRect.height - 8;

    left = Math.max(6, Math.min(left, viewportWidth - padRect.width - 6));
    top = Math.max(6, Math.min(top, viewportHeight - padRect.height - 6));

    movePad.style.left = left + "px";
    movePad.style.top = top + "px";
  }

  function openMovePad() {
    if (!sessionId || send.disabled) return;
    command.blur();
    movePadOpen = true;
    movePad.classList.add("open");
    movePad.setAttribute("aria-hidden", "false");
    send.setAttribute("aria-expanded", "true");

    positionMovePad();

    requestAnimationFrame(() => {
      positionMovePad();
      requestAnimationFrame(positionMovePad);
    });

    setTimeout(positionMovePad, 250);
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    submitMove(command.value);
  });

  command.addEventListener("focus", () => {
    closeMovePad();
  });

  send.addEventListener("click", () => {
    if (movePadOpen) {
      closeMovePad();
    } else {
      openMovePad();
    }
  });

  movePad.querySelectorAll("button[data-move]").forEach(button => {
    button.addEventListener("click", () => submitMove(button.dataset.move));
  });
  movePad.querySelectorAll("button[data-command]").forEach(button => {
    button.addEventListener("click", () => submitMove(button.dataset.command));
  });
  movePad.querySelector("[data-cancel]").addEventListener("click", closeMovePad);

  saveGame.addEventListener("click", async () => {
    if (!sessionId) return;
    try {
      const session = await request(`api/session/${sessionId}`, {
        method: "GET",
        headers: {}
      });
      const blob = new Blob([JSON.stringify(session, null, 2) + "\n"], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${session.game || "lantern"}-${sessionId}.lantern.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      status.textContent = "Game saved.";
      closeMovePad();
      openSaveChoice(session);
    } catch (err) {
      status.textContent = `Save failed: ${err.message}`;
      closeMovePad();
    }
  });

  saveDialogClose.addEventListener("click", () => saveDialog.close());

  saveIdentityAction.addEventListener("click", async () => {
    if (!pendingSavedSession) return;
    if (!chiselIdentity) {
      const returnUrl = new URL(window.location.href);
      returnUrl.searchParams.delete("identity");
      window.location.href = CHISEL_IDENTITY_URL + "?return=" + encodeURIComponent(returnUrl.toString()) + "&app=lantern";
      return;
    }
    saveIdentityAction.disabled = true;
    try {
      await saveSessionToIdentity(pendingSavedSession);
      status.textContent = "Saved JSON locally and to FileProxy under your Chisel identity.";
      saveDialog.close();
      await refreshMySaves();
    } catch (error) {
      saveIdentityText.textContent = "FileProxy save failed: " + error.message;
    } finally {
      saveIdentityAction.disabled = false;
    }
  });

  mySaves.addEventListener("click", async () => {
    await refreshMySaves();
    if (typeof mySavesDialog.showModal === "function") mySavesDialog.showModal();
  });
  mySavesClose.addEventListener("click", () => mySavesDialog.close());

  function chooseLoadFile() {
    closeMovePad();
    loadFile.value = "";
    loadFile.click();
  }

  loadGame.addEventListener("click", chooseLoadFile);
  loadGameStart.addEventListener("click", chooseLoadFile);

  loadFile.addEventListener("change", async () => {
    const file = loadFile.files && loadFile.files[0];
    if (!file) return;

    setBusy(true);
    try {
      const saved = JSON.parse(await file.text());
      await loadSessionObject(saved, file.name);
    } catch (err) {
      status.textContent = `Load failed: ${err.message}`;
      screen.textContent = `Load failed: ${err.message}`;
    } finally {
      setBusy(false);
      command.focus();
      scrollScreenToBottom();
    }
  });

  chooseGame.addEventListener("click", () => {
    closeMovePad();
    const showing = !document.body.classList.contains("playing");
    document.body.classList.toggle("playing", showing);
    if (!showing) game.focus();
    else command.focus();
  });

  newGame.addEventListener("click", startGame);
  readIdentity();
  if (chiselIdentity) refreshMySaves();
  health();
})();
</script>
</body>
</html>
